    <meta name="description" content="Toshkentda tezkor 3D bosma va nostandart ehtiyot qismlar ustaxonasi. Singan shesternalar, muhandislik korpuslari, talabalar loyihalari va me'moriy maketlar 24-48 soat ichida." />
    
    <!-- Telegram Web App SDK (Avtomatik to'liq ekran va Telegram integratsiyasi) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        function expandToFullscreen() {
          if (window.Telegram && window.Telegram.WebApp) {
            var tg = window.Telegram.WebApp;
            try {
              tg.ready();
              tg.expand();
              if (typeof tg.requestFullscreen === 'function') {
                tg.requestFullscreen();
              }
              if (typeof tg.enableClosingConfirmation === 'function') {
                tg.enableClosingConfirmation();
              }
              if (typeof tg.setHeaderColor === 'function') {
                tg.setHeaderColor('#090e1a');
              }
              if (typeof tg.setBackgroundColor === 'function') {
                tg.setBackgroundColor('#090e1a');
              }
            } catch (err) {}
          }
        }
        // Birinchi millisekunddayoq to'liq ekranga yoyish
        expandToFullscreen();
        document.addEventListener('DOMContentLoaded', expandToFullscreen);
        window.addEventListener('load', expandToFullscreen);
        window.addEventListener('focus', expandToFullscreen);
        document.addEventListener('touchstart', expandToFullscreen, { passive: true });
        document.addEventListener('click', expandToFullscreen, { passive: true });

        // Telegram WebView ochilishi davomida dastlabki 5 soniya uzluksiz to'liq ekranga yoyib turish
        var count = 0;
        var poller = setInterval(function() {
          count++;
          expandToFullscreen();
          if (count > 50) {
            clearInterval(poller);
          }
        }, 100);
      })();
    </script>
